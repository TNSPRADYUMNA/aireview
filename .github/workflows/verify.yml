name: Verify
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql+psycopg://review:review_ci@127.0.0.1:5432/review
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: review
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U review" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python benchmark.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global pnpm@11
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
